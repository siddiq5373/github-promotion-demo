# VERSION: v4 - PROMOTION + STAGING AUTO-MERGE WORKFLOW
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run ID from Build Release + DEV'
        required: true
        type: string
      target_environment:
        description: 'Environment to promote the existing build into'
        required: true
        type: choice
        options:
          - uat
          - staging
          - production

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Promote to ${{ inputs.target_environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.target_environment }}

    concurrency:
      group: deploy-${{ inputs.target_environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download exact artifact from original build run
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Verify package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-output
          sha256sum -c SHA256SUMS.txt

      - name: Read immutable build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(python3 -c "import json; print(json.load(open('release-output/manifest.json'))['version'])")
          COMMIT=$(python3 -c "import json; print(json.load(open('release-output/manifest.json'))['commit'])")
          SOURCE_BRANCH=$(python3 -c "import json; print(json.load(open('release-output/manifest.json'))['sourceBranch'])")
          SOURCE_RUN=$(python3 -c "import json; print(json.load(open('release-output/manifest.json'))['buildRunId'])")

          if [[ "$SOURCE_RUN" != "${{ inputs.build_run_id }}" ]]; then
            echo "Manifest buildRunId ($SOURCE_RUN) does not match requested build run ID (${{ inputs.build_run_id }})." >&2
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" != release/* ]]; then
            echo "Expected a release/* source branch; got: $SOURCE_BRANCH" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"

          echo "Promoting version=$VERSION commit=$COMMIT source=$SOURCE_BRANCH"

      - name: Require tested release commit to be merged into main before production
        if: ${{ inputs.target_environment == 'production' }}
        shell: bash
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags

          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "Production blocked." >&2
            echo "Tested release commit $COMMIT is not contained in main." >&2
            echo "Promote to STAGING first and allow the release PR to merge into main." >&2
            exit 1
          fi

          echo "Verified: tested release commit $COMMIT is contained in main."

      - name: Simulate delta deployment to selected environment
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail

          DEPLOY_DIR="deployed-${TARGET_ENVIRONMENT}"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          unzip -q release-output/release-package.zip -d "$DEPLOY_DIR"

          echo "=== Files that would be copied/overwritten in ${TARGET_ENVIRONMENT^^} ==="
          if [[ -d "$DEPLOY_DIR/files" ]]; then
            find "$DEPLOY_DIR/files" -type f -print | sort
          fi

          echo
          echo "=== Files that would be deleted in ${TARGET_ENVIRONMENT^^} ==="
          cat "$DEPLOY_DIR/deleted-files.txt" || true

          echo
          echo "=== Release manifest ==="
          cat "$DEPLOY_DIR/manifest.json"

          # REAL DELTA DEPLOYMENT GOES HERE.
          # Recommended sequence:
          #   1. Verify target currently matches manifest.baseTag/baseCommit.
          #   2. Copy $DEPLOY_DIR/files/. into the application root, preserving paths.
          #   3. Delete each application-relative path listed in deleted-files.txt.
          #   4. Record manifest.version/commit as the deployed version.
          #
          # Transport can be implemented using:
          # - self-hosted Windows runner + PowerShell
          # - PowerShell Remoting / WinRM
          # - SFTP / SCP
          # - rsync / SSH
          # - your existing deployment script

      - name: Create deployment receipt
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p receipt
          cp release-output/manifest.json receipt/manifest.json
          cat > receipt/deployment.txt <<TXT
          environment=${TARGET_ENVIRONMENT}
          version=${VERSION}
          commit=${COMMIT}
          source_build_run_id=${{ inputs.build_run_id }}
          promotion_workflow_run_id=${GITHUB_RUN_ID}
          deployed_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          TXT

      - name: Upload deployment receipt
        uses: actions/upload-artifact@v7
        with:
          name: deployment-receipt-${{ inputs.target_environment }}-${{ github.run_id }}
          path: receipt/
          retention-days: 90

      - name: Enable automatic release merge after successful STAGING deployment
        if: ${{ inputs.target_environment == 'staging' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ steps.meta.outputs.source_branch }}
          VERSION: ${{ steps.meta.outputs.version }}
          TESTED_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list \
            --base main \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open release PR found: $SOURCE_BRANCH -> main" >&2
            echo "Create that PR once, then rerun the STAGING promotion." >&2
            exit 1
          fi

          PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [[ "$PR_HEAD" != "$TESTED_COMMIT" ]]; then
            echo "Release PR head changed after the tested build was created." >&2
            echo "Tested commit: $TESTED_COMMIT" >&2
            echo "Current PR head: $PR_HEAD" >&2
            echo "Build and test the new release commit before merging." >&2
            exit 1
          fi

          echo "Release PR #$PR_NUMBER matches tested commit $TESTED_COMMIT."
          echo "Enabling auto-merge using a merge commit..."

          gh pr merge "$PR_NUMBER" \
            --auto \
            --merge \
            --match-head-commit "$TESTED_COMMIT"

          echo "Auto-merge enabled for PR #$PR_NUMBER."
          echo "If all merge requirements are already satisfied, GitHub may merge it immediately."
          echo "Otherwise it will merge when the remaining requirements pass."

      - name: Create production tag after successful production deployment
        if: ${{ inputs.target_environment == 'production' }}
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          git fetch --tags --force

          EXISTING_COMMIT=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)

          if [[ -n "$EXISTING_COMMIT" ]]; then
            if [[ "$EXISTING_COMMIT" != "$COMMIT" ]]; then
              echo "Tag $TAG already exists at $EXISTING_COMMIT, expected $COMMIT." >&2
              exit 1
            fi
            echo "Tag $TAG already exists on the correct commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "Production release $TAG"
          git push origin "$TAG"

      - name: Promotion summary
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          {
            echo "## Promotion complete"
            echo
            echo "- Target: \`${TARGET_ENVIRONMENT}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Original build run ID: \`${{ inputs.build_run_id }}\`"
            echo "- Promotion run ID: \`${GITHUB_RUN_ID}\`"
            if [[ "$TARGET_ENVIRONMENT" == "staging" ]]; then
              echo "- Release PR: auto-merge enabled after successful STAGING deployment"
            fi
            if [[ "$TARGET_ENVIRONMENT" == "production" ]]; then
              echo "- Main containment check: passed"
              echo "- Production tag: \`v${VERSION}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
